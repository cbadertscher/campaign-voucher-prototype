[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000000
fs_permissions = [
  { access = "read-write", path = "./gas-reports" },
  { access = "read", path = "./test/fixtures" },
]

[fuzz]
runs = 512

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
